services:
  postgres:
    image: postgres:16-alpine
    container_name: bankapp-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - bankapp-network

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.3
    container_name: bankapp-keycloak
    ports:
      - "8180:8080"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD}
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME: localhost
      KC_HOSTNAME_PORT: 8180
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
      - keycloak-data:/opt/keycloak/data
    command: start-dev --import-realm
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080 2>/dev/null && echo ok || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - bankapp-network

  spring-boot:
    build:
      context: .
    container_name: bankapp-api
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      KEYCLOAK_JWK_URI: http://keycloak:8080/realms/bankapp/protocol/openid-connect/certs
      KEYCLOAK_ADMIN_URL: http://keycloak:8080
      KEYCLOAK_ADMIN_USERNAME: admin
      KEYCLOAK_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    networks:
      - bankapp-network

  nextjs:
    build:
      context: ../BankApp
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8080
        NEXT_PUBLIC_KEYCLOAK_ISSUER: http://localhost:8180/realms/bankapp
        NEXT_PUBLIC_KEYCLOAK_CLIENT_ID: bankapp-frontend
        NEXT_PUBLIC_NEXTAUTH_URL: http://localhost:3000
    container_name: bankapp-frontend
    ports:
      - "3000:3000"
    environment:
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      KEYCLOAK_CLIENT_ID: bankapp-frontend
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET}
      KEYCLOAK_ISSUER: http://localhost:8180/realms/bankapp
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080/realms/bankapp
      AUTH_TRUST_HOST: "true"
      NODE_ENV: development
    depends_on:
      keycloak:
        condition: service_healthy
      spring-boot:
        condition: service_started
    networks:
      - bankapp-network

networks:
  bankapp-network:
    driver: bridge

volumes:
  postgres-data:
  keycloak-data:
